services:
  guides-admin:
    build: .
    container_name: kcc-guides-admin
    restart: unless-stopped
    env_file: .env
    ports:
      - "8100:8000"
    volumes:
      - ./data:/data
      # The site project folder (one level up). Read-only, except the two folders the app edits:
      - ..:/site:ro
      - ../content:/site/content
      - ../config:/site/config
      # Only if you use GitHub mode instead (SITE_DIR unset, REPO_URL set):
      # - ./ssh:/ssh:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
