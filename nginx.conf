server {
    listen 80 default_server;
    server_name _;
    root /site/dist;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Never let the browser hold onto a stale copy of anything — HTML
    # pages AND the CSS/assets — since the whole point of this project
    # is that changes show up automatically. no-cache still lets the
    # browser get a fast 304-not-modified response when nothing's
    # changed; it just forces a check every time instead of trusting a
    # long-lived cache that would hide real updates for days.
    # Attachments: never let the browser guess a type. Everything downloads
    # except PDFs, which may open in the browser's own viewer.
    location /files/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-cache";
        location ~* \.pdf$ {
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-cache";
        }
    }

    location /assets/ {
        add_header Cache-Control "no-cache";
    }
}
