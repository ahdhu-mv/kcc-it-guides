services:
  it-guides:
    build: .
    container_name: kcc-it-guides
    restart: unless-stopped
    ports:
      - "8090:80"   # change the host port if 8090 is already taken
    volumes:
      - ./content:/site/content
      - ./config:/site/config
      - ./templates:/site/templates
      - ./assets:/site/assets
    # If you're fronting this with an existing reverse proxy (nginx/Caddy/
    # Traefik) on the same Docker host, drop the ports: block above and
    # attach this to your proxy's network instead, e.g.:
    # networks:
    #   - proxy-net

  git-sync:
    build: ./deploy/git-sync
    container_name: kcc-it-guides-sync
    restart: unless-stopped
    volumes:
      - .:/repo
      - ./deploy/git-sync/ssh:/root/.ssh:ro
    environment:
      - GIT_SYNC_INTERVAL=60
      - GIT_SSH_COMMAND=ssh -i /root/.ssh/id_ed25519 -o UserKnownHostsFile=/root/.ssh/known_hosts
