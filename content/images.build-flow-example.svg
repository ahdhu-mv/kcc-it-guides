<svg width="640" height="180" viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill: #ffffff; stroke: #d8ddda; stroke-width: 1.5; }
    .label { font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; fill: #14231f; font-weight: 500; }
    .sublabel { font-family: 'IBM Plex Mono', monospace; font-size: 12px; fill: #435049; }
    .arrow { stroke: #0f6b62; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0f6b62"/>
    </marker>
  </defs>

  <rect x="10" y="50" width="170" height="80" rx="8" class="box"/>
  <text x="95" y="85" text-anchor="middle" class="label">Guide file</text>
  <text x="95" y="105" text-anchor="middle" class="sublabel">guide.md</text>

  <path d="M190 90 L235 90" class="arrow"/>

  <rect x="240" y="50" width="170" height="80" rx="8" class="box"/>
  <text x="325" y="85" text-anchor="middle" class="label">Build script</text>
  <text x="325" y="105" text-anchor="middle" class="sublabel">build.py</text>

  <path d="M420 90 L465 90" class="arrow"/>

  <rect x="470" y="50" width="160" height="80" rx="8" class="box"/>
  <text x="550" y="85" text-anchor="middle" class="label">Live guide page</text>
  <text x="550" y="105" text-anchor="middle" class="sublabel">on the site</text>
</svg>
